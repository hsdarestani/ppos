name: Deploy PPOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ppos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        id: server
        uses: appleboy/ssh-action@v1.2.2
        env:
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SENDER: ${{ secrets.SMS_SENDER }}
          SMS_LIVE: ${{ secrets.SMS_LIVE }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: SMS_PROVIDER,SMS_API_KEY,SMS_SENDER,SMS_LIVE
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git nginx python3 python3-venv python3-pip curl certbot python3-certbot-nginx openssl

            if [ ! -d /opt/ppos/.git ]; then
              rm -rf /opt/ppos
              git clone https://github.com/hsdarestani/ppos.git /opt/ppos
            else
              cd /opt/ppos
              git fetch origin main
              git reset --hard origin/main
            fi

            cd /opt/ppos
            python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            mkdir -p /opt/ppos/data

            .venv/bin/python -m py_compile app.py capture.py exports.py campaigns.py verticals.py activation.py campaign_tools.py data_ingest.py outreach.py wsgi.py
            .venv/bin/python - <<'PY'
            from wsgi import app
            from verticals import VERTICALS, CAMPAIGN_ORDER
            c = app.test_client()
            assert c.get('/').status_code == 200
            assert len(VERTICALS) >= 30
            assert len(CAMPAIGN_ORDER) == len(VERTICALS)
            health = c.get('/health/campaigns').get_json()
            assert health['vertical_count'] == 30 and health['ab_ready'] and health['demo_ready']
            outreach = c.get('/health/outreach').get_json()
            assert outreach['ok'] is True and set(outreach['providers']) == {'ippanel','kavenegar'}
            for key, info in VERTICALS.items():
                assert info.get('label') and info.get('product') and info.get('price')
                assert len(info.get('hooks') or []) >= 2
                assert len(info.get('questions') or []) == 3
            routes = {r.rule for r in app.url_map.iter_rules()}
            required = {
                '/health/campaigns','/health/outreach',
                '/admin/campaigns','/admin/campaigns/import','/admin/campaigns/template.csv','/admin/data/import-raw',
                '/admin/outreach','/admin/outreach/prepare','/admin/outreach/send','/admin/outreach/suppress',
                '/admin/campaign/<vertical>','/admin/campaign/<vertical>/sms.csv','/admin/campaign/<vertical>/calls.csv',
                '/v/<slug>','/m/<slug>','/api/v/<slug>/lead','/api/v/<slug>/event','/activate/<slug>',
                '/admin/campaign/realestate','/api/realestate/<slug>/lead','/p/<slug>'
            }
            missing = required - routes
            assert not missing, f'Missing routes: {missing}'
            for template in ['campaigns_hub.html','campaign_vertical.html','demo_vertical.html','merchant_vertical.html','activation_vertical.html','outreach.html']:
                app.jinja_env.get_template(template)
            print(f'PPOS campaign ops self-test passed: {len(VERTICALS)} verticals + raw ingest + SMS queue')
            PY

            if [ ! -f /etc/ppos.env ]; then
              echo "SECRET_KEY=$(openssl rand -hex 32)" > /etc/ppos.env
              chmod 600 /etc/ppos.env
            fi
            sed -i '/^SMS_PROVIDER=/d;/^SMS_API_KEY=/d;/^SMS_SENDER=/d;/^SMS_LIVE=/d' /etc/ppos.env
            [ -n "$SMS_PROVIDER" ] && printf 'SMS_PROVIDER=%s\n' "$SMS_PROVIDER" >> /etc/ppos.env || true
            [ -n "$SMS_API_KEY" ] && printf 'SMS_API_KEY=%s\n' "$SMS_API_KEY" >> /etc/ppos.env || true
            [ -n "$SMS_SENDER" ] && printf 'SMS_SENDER=%s\n' "$SMS_SENDER" >> /etc/ppos.env || true
            printf 'SMS_LIVE=%s\n' "${SMS_LIVE:-0}" >> /etc/ppos.env
            chmod 600 /etc/ppos.env

            cat > /etc/systemd/system/ppos.service <<'EOF'
            [Unit]
            Description=PPOS Flask Application
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/ppos
            EnvironmentFile=/etc/ppos.env
            Environment=PORT=8080
            ExecStart=/opt/ppos/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 60 --bind 127.0.0.1:8080 wsgi:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/nginx/sites-available/ppos <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name ppos.smarbiz.sbs;
                client_max_body_size 12m;

                location /static/ {
                    alias /opt/ppos/static/;
                    expires 1h;
                    add_header Cache-Control "public";
                }

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            ln -sfn /etc/nginx/sites-available/ppos /etc/nginx/sites-enabled/ppos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl daemon-reload
            systemctl enable --now ppos
            systemctl restart ppos
            systemctl enable --now nginx
            systemctl reload nginx

            sleep 2
            curl -fsS http://127.0.0.1:8080/health/campaigns | grep -q '"vertical_count":30'
            curl -fsS http://127.0.0.1:8080/health/outreach | grep -q '"ok":true'
            systemctl is-active --quiet ppos

            certbot --nginx -d ppos.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            systemctl reload nginx
            echo "PPOS deployment complete"

      - name: Check public campaign ops
        id: public
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for i in {1..6}; do
            C=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/campaigns || true)
            O=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/outreach || true)
            if echo "$C" | grep -q '"vertical_count":30' && echo "$C" | grep -q '"ab_ready":true' && echo "$O" | grep -q '"ok":true'; then
              echo "Public campaign ops health check passed"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const server = '${{ steps.server.outcome }}';
            const publicHealth = '${{ steps.public.outcome }}';
            const icon = server === 'success' && publicHealth === 'success' ? '✅' : (server === 'success' ? '⚠️' : '❌');
            const body = `${icon} **Production check for ${context.sha.substring(0, 7)}**\n\n- Server deploy: **${server}**\n- Public campaign ops: **${publicHealth}**\n- Campaign engine: **30 verticals**\n- Raw CSV/XLSX ingestion: **enabled**\n- SMS providers: **IPPanel + Kavenegar**\n- SMS default mode: **dry-run unless SMS_LIVE=1**\n- Campaign hub: https://ppos.smarbiz.sbs/admin/campaigns\n- Outbound Ops: https://ppos.smarbiz.sbs/admin/outreach\n`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body});

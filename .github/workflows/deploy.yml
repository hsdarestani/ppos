name: Deploy PPOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ppos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git nginx python3 python3-venv python3-pip curl certbot python3-certbot-nginx openssl

            if [ ! -d /opt/ppos/.git ]; then
              rm -rf /opt/ppos
              git clone https://github.com/hsdarestani/ppos.git /opt/ppos
            else
              cd /opt/ppos
              git fetch origin main
              git reset --hard origin/main
            fi

            cd /opt/ppos
            python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            mkdir -p /opt/ppos/data

            if [ ! -f /etc/ppos.env ]; then
              echo "SECRET_KEY=$(openssl rand -hex 32)" > /etc/ppos.env
              chmod 600 /etc/ppos.env
            fi

            cat > /etc/systemd/system/ppos.service <<'EOF'
            [Unit]
            Description=PPOS Flask Application
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/ppos
            EnvironmentFile=/etc/ppos.env
            Environment=PORT=8080
            ExecStart=/opt/ppos/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 60 --bind 127.0.0.1:8080 app:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/nginx/sites-available/ppos <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name ppos.smarbiz.sbs;
                client_max_body_size 3m;

                location /static/ {
                    alias /opt/ppos/static/;
                    expires 1h;
                    add_header Cache-Control "public";
                }

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            ln -sfn /etc/nginx/sites-available/ppos /etc/nginx/sites-enabled/ppos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl daemon-reload
            systemctl enable --now ppos
            systemctl restart ppos
            systemctl enable --now nginx
            systemctl reload nginx

            sleep 2
            curl -fsS http://127.0.0.1:8080/ >/dev/null

            certbot --nginx -d ppos.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            systemctl reload nginx

            echo "PPOS deployment complete"

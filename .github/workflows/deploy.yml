name: Deploy PPOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ppos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        id: server
        uses: appleboy/ssh-action@v1.2.2
        env:
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_USERNAME: ${{ secrets.SMS_USERNAME }}
          SMS_PASSWORD: ${{ secrets.SMS_PASSWORD }}
          SMS_SENDER: ${{ secrets.SMS_SENDER }}
          SMS_LIVE: ${{ secrets.SMS_LIVE }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: SMS_PROVIDER,SMS_API_KEY,SMS_USERNAME,SMS_PASSWORD,SMS_SENDER,SMS_LIVE,GOOGLE_MAPS_API_KEY,GOOGLE_MAPS_EMBED_KEY
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git nginx python3 python3-venv python3-pip curl certbot python3-certbot-nginx openssl

            if [ ! -d /opt/ppos/.git ]; then
              rm -rf /opt/ppos
              git clone https://github.com/hsdarestani/ppos.git /opt/ppos
            else
              cd /opt/ppos
              git fetch origin main
              git reset --hard origin/main
            fi

            cd /opt/ppos
            python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            mkdir -p /opt/ppos/data

            .venv/bin/python -m py_compile app.py capture.py exports.py campaigns.py verticals.py activation.py campaign_tools.py data_ingest.py outreach.py call_ops.py presentation.py outbound_copy.py site_blueprints.py vertical_sites.py booking_os.py site_redirects.py db_optimizations.py vendor_compat.py wsgi.py
            .venv/bin/python -m unittest -v tests.test_beauty_os
            .venv/bin/python - <<'PY'
            import io, sqlite3
            from openpyxl import Workbook
            from werkzeug.datastructures import FileStorage
            from wsgi import app, DB_PATH
            from verticals import VERTICALS, CAMPAIGN_ORDER
            from site_blueprints import SITE_BLUEPRINTS, get_blueprint
            from data_ingest import _header_map, detect_vertical, _normalize_mobile, _normalize_phone, _rows_from_upload
            c = app.test_client()
            assert c.get('/').status_code == 200
            assert len(VERTICALS) == 30 and len(CAMPAIGN_ORDER) == 30
            assert len(SITE_BLUEPRINTS) == 30
            assert set(SITE_BLUEPRINTS) == set(CAMPAIGN_ORDER)
            for key in CAMPAIGN_ORDER:
                bp = get_blueprint(key, VERTICALS[key])
                assert bp.get('layout') and bp.get('hero_title') and bp.get('hero_sub')
                assert len(bp.get('services') or []) >= 4
                assert len(bp.get('catalog') or []) >= 6
                assert len(bp.get('process') or []) == 3
                assert len(bp.get('faq') or []) >= 3
                assert len(bp.get('palette') or []) == 3

            health = c.get('/health/campaigns').get_json()
            assert health['vertical_count'] == 30 and health['ab_ready'] and health['demo_ready']
            outreach = c.get('/health/outreach').get_json()
            assert outreach['ok'] is True and set(outreach['providers']) == {'melipayamak','ippanel','kavenegar'}
            sites = c.get('/health/sites').get_json()
            assert sites['ok'] is True and sites['verticals'] == 30
            assert set(['home','services','catalog','about','contact','account']).issubset(sites['pages'])
            beauty = c.get('/health/beauty-os').get_json()
            assert beauty['ok'] is True and beauty['multi_tenant'] is True and beauty['services'] >= 8
            assert beauty['customer_auth'] and beauty['admin_auth'] and beauty['booking']
            assert c.get('/demo/salon-morvarid').status_code == 200
            assert c.get('/demo/salon-morvarid/login').status_code == 200
            assert c.get('/demo/salon-morvarid/admin/login').status_code == 200
            assert app.config['MAX_CONTENT_LENGTH'] >= 100 * 1024 * 1024

            headers = ['نام فروشگاه یا مرکز','تفکیک صنف','شماره موبایل','تلفن ثابت','آدرس پستی','نام فرد مسئول']
            hm = _header_map(headers)
            assert hm['business_name'] == 'نام فروشگاه یا مرکز'
            assert hm['category'] == 'تفکیک صنف'
            assert hm['mobile'] == 'شماره موبایل'
            google_headers = ['Name','Category','phoneNumber','Address','Website','Rating','Reviews count','Location Lat','Location Lng','social Links','Images']
            ghm = _header_map(google_headers)
            for required_google in ['business_name','category','phone_any','address','website','rating','reviews','latitude','longitude','instagram','logo_url']:
                assert required_google in ghm, f'Google Maps header missing: {required_google}'
            assert detect_vertical('Beauty salon') == 'beauty'
            assert detect_vertical('Real estate agency') == 'realestate'
            assert detect_vertical('Auto repair shop') == 'repair'
            assert _normalize_mobile('+98 912 123 4567') == '09121234567'
            assert _normalize_phone('+98 21 1234 5678').startswith('021')

            # Regression: metadata rows before the real XLSX header, parsed from
            # an in-memory Werkzeug FileStorage instead of passing the temp file
            # directly into openpyxl.
            wb = Workbook(); ws = wb.active
            for i in range(6): ws.append([f'Export metadata {i+1}'])
            ws.append(google_headers)
            ws.append(['سالن تست','Beauty salon','+98 912 123 4567','کرج','https://example.com',4.8,33,35.8,50.9,'https://instagram.com/test','https://example.com/a.jpg'])
            buf = io.BytesIO(); wb.save(buf); buf.seek(0)
            upload = FileStorage(stream=buf, filename='google-export.xlsx')
            parsed = list(_rows_from_upload(upload))
            assert len(parsed) == 1 and parsed[0]['Name'] == 'سالن تست'

            conn = sqlite3.connect(DB_PATH)
            table_names = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            for table in ['lead_external_ids','site_customers','site_requests','site_catalog_items','site_favorites','site_page_overrides','businesses','users','customers','staff','services','appointments','campaigns','messages','reviews','payments','favorites','staff_schedules']:
                assert table in table_names, table
            conn.close()

            for key, info in VERTICALS.items():
                assert info.get('label') and info.get('product') and info.get('price')
                assert len(info.get('hooks') or []) >= 2
                assert len(info.get('questions') or []) == 3
                assert info.get('hero_image') and info.get('theme_primary')
                assert info.get('headline') and info.get('offer_title')
                assert '{url}' in info['hooks'][0] and '{name}' in info['hooks'][0]

            routes = {r.rule for r in app.url_map.iter_rules()}
            required = {
                '/health/campaigns','/health/outreach','/health/sites',
                '/admin/campaigns','/admin/campaigns/import','/admin/campaigns/template.csv','/admin/data/import-raw',
                '/admin/outreach','/admin/outreach/prepare','/admin/outreach/send','/admin/outreach/suppress',
                '/admin/calls','/admin/calls/<int:lead_id>/log',
                '/admin/campaign/<vertical>','/admin/campaign/<vertical>/sms.csv','/admin/campaign/<vertical>/calls.csv',
                '/v/<slug>','/d/<slug>','/m/<slug>','/api/v/<slug>/lead','/api/v/<slug>/event','/activate/<slug>',
                '/s/<slug>','/s/<slug>/<page>','/s/<slug>/request','/s/<slug>/account','/s/<slug>/account/login','/s/<slug>/account/logout','/s/<slug>/favorite/<int:item_id>',
                '/beauty-os','/demo/<slug>','/api/demo/<slug>/availability','/api/demo/<slug>/book','/demo/<slug>/login','/demo/<slug>/account','/demo/<slug>/admin/login','/demo/<slug>/admin','/health/beauty-os',
                '/admin/campaign/realestate','/api/realestate/<slug>/lead','/p/<slug>'
            }
            missing = required - routes
            assert not missing, f'Missing routes: {missing}'
            for template in ['campaigns_hub.html','campaign_vertical.html','demo_vertical.html','demo_realestate.html','merchant_vertical.html','activation_vertical.html','outreach.html','calls.html','vertical_site.html','vertical_site_login.html','vertical_site_account.html','beauty_public.html','beauty_login.html','beauty_account.html','beauty_admin_login.html','beauty_admin.html']:
                app.jinja_env.get_template(template)
            print('PPOS self-test passed: Beauty OS multi-tenant booking + customer/admin auth + 30 campaign verticals')
            PY

            if [ ! -f /etc/ppos.env ]; then
              echo "SECRET_KEY=$(openssl rand -hex 32)" > /etc/ppos.env
              chmod 600 /etc/ppos.env
            fi
            sed -i '/^SMS_PROVIDER=/d;/^SMS_API_KEY=/d;/^SMS_USERNAME=/d;/^SMS_PASSWORD=/d;/^SMS_SENDER=/d;/^SMS_LIVE=/d;/^GOOGLE_MAPS_API_KEY=/d;/^GOOGLE_MAPS_EMBED_KEY=/d' /etc/ppos.env
            [ -n "$SMS_PROVIDER" ] && printf 'SMS_PROVIDER=%s\n' "$SMS_PROVIDER" >> /etc/ppos.env || true
            [ -n "$SMS_API_KEY" ] && printf 'SMS_API_KEY=%s\n' "$SMS_API_KEY" >> /etc/ppos.env || true
            [ -n "$SMS_USERNAME" ] && printf 'SMS_USERNAME=%s\n' "$SMS_USERNAME" >> /etc/ppos.env || true
            [ -n "$SMS_PASSWORD" ] && printf 'SMS_PASSWORD=%s\n' "$SMS_PASSWORD" >> /etc/ppos.env || true
            [ -n "$SMS_SENDER" ] && printf 'SMS_SENDER=%s\n' "$SMS_SENDER" >> /etc/ppos.env || true
            printf 'SMS_LIVE=%s\n' "${SMS_LIVE:-0}" >> /etc/ppos.env
            [ -n "$GOOGLE_MAPS_API_KEY" ] && printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" >> /etc/ppos.env || true
            [ -n "$GOOGLE_MAPS_EMBED_KEY" ] && printf 'GOOGLE_MAPS_EMBED_KEY=%s\n' "$GOOGLE_MAPS_EMBED_KEY" >> /etc/ppos.env || true
            chmod 600 /etc/ppos.env

            cat > /etc/systemd/system/ppos.service <<'EOF'
            [Unit]
            Description=PPOS Flask Application
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/ppos
            EnvironmentFile=/etc/ppos.env
            Environment=PORT=8080
            ExecStart=/opt/ppos/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 600 --graceful-timeout 30 --bind 127.0.0.1:8080 wsgi:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/nginx/sites-available/ppos <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name ppos.smarbiz.sbs;
                client_max_body_size 120m;
                location /static/ { alias /opt/ppos/static/; expires 1h; add_header Cache-Control "public"; }
                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_read_timeout 620s;
                    proxy_send_timeout 620s;
                    proxy_connect_timeout 30s;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            ln -sfn /etc/nginx/sites-available/ppos /etc/nginx/sites-enabled/ppos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl daemon-reload
            systemctl enable --now ppos
            systemctl restart ppos
            systemctl enable --now nginx
            systemctl reload nginx
            sleep 2
            curl -fsS http://127.0.0.1:8080/health/campaigns | grep -q '"vertical_count":30'
            curl -fsS http://127.0.0.1:8080/health/outreach | grep -q '"ok":true'
            curl -fsS http://127.0.0.1:8080/health/sites | grep -q '"verticals":30'
            curl -fsS http://127.0.0.1:8080/health/beauty-os | grep -q '"ok":true'
            systemctl is-active --quiet ppos
            certbot --nginx -d ppos.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            systemctl reload nginx
            echo "PPOS deployment complete"

      - name: Check public platform
        id: public
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for i in {1..6}; do
            C=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/campaigns || true)
            O=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/outreach || true)
            S=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/sites || true)
            B=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/beauty-os || true)
            if echo "$C" | grep -q '"vertical_count":30' && echo "$O" | grep -q '"ok":true' && echo "$S" | grep -q '"verticals":30' && echo "$S" | grep -q '"ok":true' && echo "$B" | grep -q '"ok":true'; then
              echo "Public platform health check passed"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const server = '${{ steps.server.outcome }}';
            const publicHealth = '${{ steps.public.outcome }}';
            const icon = server === 'success' && publicHealth === 'success' ? '✅' : (server === 'success' ? '⚠️' : '❌');
            const body = `${icon} **Production check for ${context.sha.substring(0, 7)}**\n\n- Server deploy: **${server}**\n- Public platform: **${publicHealth}**\n- Beauty OS: **public site + booking + customer portal + salon dashboard**\n- Multi-tenant SaaS models: **12/12**\n- Deep outbound verticals: **30/30**\n- Public pages per business: **Home + Services + Catalog + About + Contact**\n- Customer account/portal: **enabled**\n- Legacy SMS links → full site: **enabled**\n- Google Maps CSV/XLSX import: **validated**\n- Live Maps embed: **enabled when key exists**\n- SMS providers: **MeliPayamak + IPPanel + Kavenegar**\n- Beauty OS demo: https://ppos.smarbiz.sbs/beauty-os\n- Campaign hub: https://ppos.smarbiz.sbs/admin/campaigns\n- Outbound Ops: https://ppos.smarbiz.sbs/admin/outreach\n- Call Desk: https://ppos.smarbiz.sbs/admin/calls\n`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body});

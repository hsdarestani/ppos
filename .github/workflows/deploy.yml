name: Deploy PPOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ppos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        id: server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git nginx python3 python3-venv python3-pip curl certbot python3-certbot-nginx openssl

            if [ ! -d /opt/ppos/.git ]; then
              rm -rf /opt/ppos
              git clone https://github.com/hsdarestani/ppos.git /opt/ppos
            else
              cd /opt/ppos
              git fetch origin main
              git reset --hard origin/main
            fi

            cd /opt/ppos
            python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            mkdir -p /opt/ppos/data

            .venv/bin/python -m py_compile app.py capture.py exports.py campaigns.py verticals.py activation.py campaign_tools.py wsgi.py
            .venv/bin/python - <<'PY'
            from wsgi import app
            from verticals import VERTICALS, CAMPAIGN_ORDER
            c = app.test_client()
            assert c.get('/').status_code == 200
            assert len(VERTICALS) >= 30, f'Expected 30+ verticals, got {len(VERTICALS)}'
            assert len(CAMPAIGN_ORDER) == len(VERTICALS)
            health = c.get('/health/campaigns')
            assert health.status_code == 200
            assert health.get_json()['vertical_count'] == 30
            assert health.get_json()['ab_ready'] is True
            assert health.get_json()['demo_ready'] is True
            for key, info in VERTICALS.items():
                assert info.get('label') and info.get('product') and info.get('price')
                assert len(info.get('hooks') or []) >= 2, f'{key} needs A/B hooks'
                assert len(info.get('questions') or []) == 3, f'{key} needs 3 demo questions'
            routes = {r.rule for r in app.url_map.iter_rules()}
            required = {
                '/health/campaigns',
                '/admin/campaigns',
                '/admin/campaigns/import',
                '/admin/campaigns/template.csv',
                '/api/campaigns/readiness',
                '/admin/campaign/<vertical>',
                '/admin/campaign/<vertical>/sms.csv',
                '/admin/campaign/<vertical>/calls.csv',
                '/v/<slug>',
                '/m/<slug>',
                '/api/v/<slug>/lead',
                '/api/v/<slug>/event',
                '/activate/<slug>',
                '/admin/campaign/realestate',
                '/api/realestate/<slug>/lead',
                '/p/<slug>'
            }
            missing = required - routes
            assert not missing, f'Missing routes: {missing}'
            for template in ['campaigns_hub.html','campaign_vertical.html','demo_vertical.html','merchant_vertical.html','activation_vertical.html']:
                app.jinja_env.get_template(template)
            print(f'PPOS all-vertical self-test passed with {len(VERTICALS)} verticals')
            PY

            if [ ! -f /etc/ppos.env ]; then
              echo "SECRET_KEY=$(openssl rand -hex 32)" > /etc/ppos.env
              chmod 600 /etc/ppos.env
            fi

            cat > /etc/systemd/system/ppos.service <<'EOF'
            [Unit]
            Description=PPOS Flask Application
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/ppos
            EnvironmentFile=/etc/ppos.env
            Environment=PORT=8080
            ExecStart=/opt/ppos/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 60 --bind 127.0.0.1:8080 wsgi:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/nginx/sites-available/ppos <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name ppos.smarbiz.sbs;
                client_max_body_size 3m;

                location /static/ {
                    alias /opt/ppos/static/;
                    expires 1h;
                    add_header Cache-Control "public";
                }

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            ln -sfn /etc/nginx/sites-available/ppos /etc/nginx/sites-enabled/ppos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl daemon-reload
            systemctl enable --now ppos
            systemctl restart ppos
            systemctl enable --now nginx
            systemctl reload nginx

            sleep 2
            curl -fsS http://127.0.0.1:8080/ >/dev/null
            curl -fsS http://127.0.0.1:8080/health/campaigns | grep -q '"vertical_count":30'
            systemctl is-active --quiet ppos

            certbot --nginx -d ppos.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            systemctl reload nginx

            echo "PPOS deployment complete"

      - name: Check public campaign engine
        id: public
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for i in {1..6}; do
            BODY=$(curl -fsS --connect-timeout 8 --max-time 15 https://ppos.smarbiz.sbs/health/campaigns || true)
            if echo "$BODY" | grep -q '"vertical_count":30' && echo "$BODY" | grep -q '"ab_ready":true' && echo "$BODY" | grep -q '"demo_ready":true'; then
              echo "Public 30-vertical campaign health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Public campaign health check failed"
          exit 1

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const server = '${{ steps.server.outcome }}';
            const publicHealth = '${{ steps.public.outcome }}';
            const icon = server === 'success' && publicHealth === 'success' ? '✅' : (server === 'success' ? '⚠️' : '❌');
            const body = `${icon} **Production check for ${context.sha.substring(0, 7)}**\n\n- Server deploy: **${server}**\n- Public 30-vertical engine: **${publicHealth}**\n- Campaign engine: **30 verticals**\n- A/B hooks: **validated**\n- Demo questions: **validated**\n- URL: https://ppos.smarbiz.sbs\n- Campaign hub: https://ppos.smarbiz.sbs/admin/campaigns\n- Health: https://ppos.smarbiz.sbs/health/campaigns\n\n${server === 'success' && publicHealth !== 'success' ? 'The app passed its on-server self-test, but the public campaign engine health check is not yet passing.' : ''}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
